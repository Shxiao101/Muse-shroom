[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-shroom"
version = "0.1.0"
description = "Evidence-backed GitHub discovery for popular projects and hidden gems"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muse-shroom contributors" }]
dependencies = ["keyring>=25,<26"]

[project.scripts]
muse-shroom = "repo_radar.cli:main"
repo-radar = "repo_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
