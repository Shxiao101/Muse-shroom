[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-shroom"
version = "0.6.0"
description = "Evidence-backed GitHub boundary discovery for new solution mechanisms"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muse-shroom contributors" }]
dependencies = ["keyring>=25,<26"]

[project.optional-dependencies]
mcp = ["mcp>=2.0.0,<3"]
test = ["mcp>=2.0.0,<3"]

[project.scripts]
muse-shroom = "muse_shroom.cli:main"
muse-shroom-mcp = "muse_shroom.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
muse_shroom = ["explorer/static/*"]
