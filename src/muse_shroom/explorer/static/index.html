<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Muse-shroom Explorer</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <a class="brand" href="#/">Muse-shroom Explorer</a>
      <p class="tagline">只读浏览 Search Boundary · 不发起搜索</p>
      <span id="debug-flag" class="debug-flag hidden">debug</span>
    </header>
    <main id="main"></main>
  </div>
  <aside id="drawer" class="drawer hidden" hidden>
    <button type="button" class="drawer-close" id="drawer-close">关闭</button>
    <div id="drawer-body"></div>
  </aside>
  <div id="drawer-mask" class="mask hidden" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
