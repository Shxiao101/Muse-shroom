<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Muse-shroom Explorer</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>
  <div id="app">
    <header class="topbar">
      <a class="brand" href="#/">Muse-shroom Explorer</a>
      <p class="tagline" id="tagline">只读浏览 Search Boundary · 不发起搜索</p>
      <div class="topbar-end">
        <span id="debug-flag" class="debug-flag hidden">debug</span>
        <button type="button" id="theme-toggle" class="icon-btn" aria-live="polite">
          <svg class="icon icon-auto" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="8"></circle>
            <path d="M12 4a8 8 0 0 0 0 16z" class="fill"></path>
          </svg>
          <svg class="icon icon-light" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="4.5"></circle>
            <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"></path>
          </svg>
          <svg class="icon icon-dark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"></path>
          </svg>
        </button>
        <button type="button" id="lang-toggle" class="lang-toggle">EN</button>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
  <aside id="drawer" class="drawer hidden" hidden aria-modal="true" role="dialog">
    <button type="button" class="drawer-close" id="drawer-close">关闭</button>
    <div id="drawer-body"></div>
  </aside>
  <div id="drawer-mask" class="mask hidden" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
